    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #181818;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .top-button-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .cards-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: #000000;
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
            flex: 1 1 350px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.4);
            margin: 20px 0;
            border: none;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            align-items: center;
            padding: 10px 0;
        }

        .column {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .vertical-divider {
            width: 1px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 0 auto;
        }

        .header-row {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .data-row {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        .light-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
            margin: 20px 0 10px 0;
            border: none;
        }
         
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 10px;
            width: 100%;
            max-width: 130px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        /* كلاس مخصص للزر العلوي لتوسيعه بحجم مناسب للنص الطويل */
        .top-btn {
            max-width: 320px; /* توسيع عرض الزر */
            padding: 10px 18px; /* زيادة المساحة الداخلية */
            font-size: 13px; /* ضبط حجم الخط */
        }

        .download-btn:hover {
            background: #e6e6e6;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 704px) {
            .cards-container {
                flex-direction: column;
                gap: 20px;
            }
            .card {
                padding: 30px 15px;
            }
            .title {
                font-size: 22px;
            }
            .header-row, .data-row {
                font-size: 18px;
            }
            .download-btn {
                font-size: 11px;
                padding: 5px 8px;
                max-width: 110px;
            }
            .top-btn {
                max-width: 300px;
                font-size: 12px;
            }
        }
    </style>
</head>
