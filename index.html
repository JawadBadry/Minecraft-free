<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Minecraft free | ماين كرافت مجانا</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #181818;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background-color: #000000;
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.4);
            margin: 20px 0;
            border: none;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            align-items: center;
            padding: 10px 0;
        }

        .column {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .vertical-divider {
            width: 1px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 0 auto;
        }

        .header-row {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .data-row {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        .light-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
            margin: 20px 0 10px 0;
            border: none;
        }
         
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 10px;
            width: 100%;
            max-width: 130px; /* تحديد أقصى عرض للزر لعدم الخروج عن إطار العمود */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            white-space: nowrap; /* منع نزول النص لسطر جديد */
        }

        .download-btn:hover {
            background: #e6e6e6;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 15px;
            }
            .title {
                font-size: 22px;
            }
            .header-row, .data-row {
                font-size: 18px;
            }
            .download-btn {
                font-size: 11px;
                padding: 5px 8px;
                max-width: 110px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">تحديثات ماين كرافت<br>Bedrock و تحميلها</h1>
        
        <hr class="divider">

        <div class="table-row header-row">
            <div class="column">التحديث</div>
            <div class="vertical-divider"></div>
            <div class="column">التحميل</div>
        </div>

        <hr class="divider">

        <div class="table-row data-row">
            <div class="column">1.26.40</div>
            <div class="vertical-divider"></div>
            <div class="column">
                <a href="https://1024terabox.com/s/1tI80EdsMmv5hCmRDxScQtg" class="download-btn">تحميل | Download</a>
            </div>
        </div>

        <hr class="light-divider">

        <div class="table-row data-row">
            <div class="column">قريبا ...</div>
            <div class="vertical-divider"></div>
            <div class="column">
                <a class="download-btn" >قريبا ...</a>
            </div>
        </div>

        <hr class="light-divider">
    </div>
    
</body>
</html>
